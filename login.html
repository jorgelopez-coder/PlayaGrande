<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · Kioskos Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#faf7f0; --card:#fff; --border:#c8ddd0; --text:#1c3a28;
      --muted:#5a8a6a; --subtle:#a0c8b0; --green:#1a7a4a;
      --green-bg:#eef8f2; --red:#c84a20; --red-bg:#fdf0eb;
      --font-d:'Inter Tight',sans-serif; --font-b:'Inter',sans-serif;
    }
    body {
      background:var(--bg); color:var(--text); font-family:var(--font-b);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:2rem;
    }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:16px;
      padding:2.5rem; width:100%; max-width:380px;
    }
    .logo { display:flex; align-items:center; gap:10px; margin-bottom:2rem; }
    .logo-mark {
      width:40px; height:40px; border-radius:10px; background:var(--text);
      display:flex; align-items:center; justify-content:center;
    }
    .logo-mark svg { width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .logo-name { font-family:var(--font-d); font-size:17px; font-weight:700; }
    .logo-sub  { font-size:12px; color:var(--muted); }
    h1 { font-family:var(--font-d); font-size:22px; font-weight:700; margin-bottom:6px; }
    p  { font-size:13px; color:var(--muted); margin-bottom:2rem; }
    label { font-size:13px; font-weight:500; color:var(--text); display:block; margin-bottom:6px; }
    .pin-wrap { position:relative; margin-bottom:1.25rem; }
    input[type="password"], input[type="text"].pin {
      width:100%; background:var(--bg); border:1.5px solid var(--border);
      border-radius:10px; color:var(--text); font-family:var(--font-b);
      font-size:20px; letter-spacing:.3em; padding:12px 40px 12px 16px;
      outline:none; transition:border-color .15s;
    }
    input[type="password"]:focus { border-color:var(--green); }
    .toggle-vis {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:var(--subtle);
      font-size:12px; padding:4px;
    }
    .btn {
      width:100%; background:var(--text); color:#fff; border:none;
      border-radius:10px; font-family:var(--font-d); font-size:15px;
      font-weight:700; padding:13px; cursor:pointer; transition:opacity .15s;
    }
    .btn:hover { opacity:.88; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .error {
      font-size:12px; color:var(--red); background:var(--red-bg);
      border:1px solid #f0c0a8; border-radius:8px; padding:9px 12px;
      margin-top:12px; display:none; text-align:center;
    }
    .footer { text-align:center; margin-top:1.5rem; font-size:11px; color:var(--subtle); }
    .divider { display:flex; align-items:center; gap:10px; margin:1.5rem 0 1.25rem; color:var(--subtle); font-size:11px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .google-wrap { display:flex; justify-content:center; }
    .google-error {
      font-size:12px; color:var(--red); background:var(--red-bg);
      border:1px solid #f0c0a8; border-radius:8px; padding:9px 12px;
      margin-top:12px; display:none; text-align:center;
    }
    .pin-link {
      display:block; width:100%; text-align:center; margin-top:1.25rem;
      background:none; border:none; color:var(--muted); font-size:12px;
      font-family:var(--font-b); cursor:pointer; text-decoration:underline;
    }
    .pin-link:hover { color:var(--text); }
    #pin-section { display:none; margin-top:1.25rem; }
  </style>
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M3 22h18M5 22V9a1 1 0 011-1h12a1 1 0 011 1v13M8 8V4h8v4M12 12v6"/></svg>
    </div>
    <div>
      <div class="logo-name">Playa Grande Brew House</div>
      <div class="logo-sub">Ecosistema Kioskos</div>
    </div>
  </div>

  <h1>Bienvenido</h1>
  <p>Entrá con tu correo registrado para continuar.</p>

  <!-- Método principal: correo individual (Google) -->
  <div id="google-section" style="display:none;">
    <div class="google-wrap" id="g_id_button"></div>
    <div class="google-error" id="google-error-msg"></div>
  </div>
  <div class="error" id="google-unavailable" style="display:none;">
    El acceso con correo no está disponible en este momento. Usá el código de acceso.
  </div>

  <!-- Respaldo: código de acceso (PIN) por rol, oculto por defecto -->
  <button class="pin-link" id="pin-toggle" onclick="togglePin()" type="button">¿Problemas para entrar? Usar código de acceso</button>
  <div id="pin-section">
    <label for="pin">Código de acceso</label>
    <div class="pin-wrap">
      <input type="password" id="pin" maxlength="10" placeholder="••••" autocomplete="off"
        onkeydown="if(event.key==='Enter')ingresar()">
      <button class="toggle-vis" onclick="toggleVis()" type="button" title="Mostrar código">👁</button>
    </div>
    <button class="btn" id="btn-ingresar" onclick="ingresar()">Ingresar</button>
    <div class="error" id="error-msg">Código incorrecto. Intentá nuevamente.</div>
  </div>

  <div class="footer">Playa Grande Brew House · Portal interno de kioskos</div>
</div>

<script>
// Login principal: correo individual con Google. Cada correo debe estar dado
// de alta en admin-accesos.html → Asignación de personal, con un Rol y un
// kiosko asignados. El Rol define los módulos; el kiosko del usuario define
// a qué kiosko(s) se limita la sesión. El PIN por rol queda como respaldo
// (link "Usar código de acceso") para terminales compartidas o si Google no
// estuviera disponible.
const GOOGLE_CLIENT_ID = '853957823193-fncpv7krc70cd4okguamathqr44ld6ka.apps.googleusercontent.com';

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_qocfx6f1d0qDgz6KS1B9DpACtVXtvGtWFSIPJzx1jkPdcNn144kGGBa0ndSsCWBzzg/exec';

// Rol de respaldo — solo para el acceso por PIN si todavía no se desplegó el
// backend con la pestaña "Roles", o si no hay conexión.
const ADMIN_DEFAULT = { id:'admin', nombre:'Administrador', pin:'admin', color:'#1a7a4a', modulos:'todos', kioskos:'todos' };

let ROLES = null;

function parseLista(v) {
  const s = String(v == null ? 'todos' : v).trim();
  if (!s || s.toLowerCase() === 'todos') return 'todos';
  return s.split(',').map(x => x.trim()).filter(Boolean);
}

async function cargarRoles() {
  try {
    const resp = await fetch(APPS_SCRIPT_URL + '?modulo=roles');
    const data = await resp.json();
    const registros = (data.ok && Array.isArray(data.registros)) ? data.registros : [];
    const activos = registros.filter(r => String(r['Activo']||'Sí').trim().toLowerCase() !== 'no');
    ROLES = activos.length ? activos.map(r => ({
      id: r['ID'], nombre: r['Nombre'], pin: String(r['PIN']||'').trim(),
      color: r['Color'] || '#1a7a4a',
      modulos: parseLista(r['Modulos']), kioskos: parseLista(r['Kioskos'])
    })) : [ADMIN_DEFAULT];
    localStorage.setItem('portal_roles_cache', JSON.stringify(ROLES));
  } catch (e) {
    try { ROLES = JSON.parse(localStorage.getItem('portal_roles_cache')||'null') || [ADMIN_DEFAULT]; }
    catch { ROLES = [ADMIN_DEFAULT]; }
  }
  const pin = document.getElementById('pin');
  const btn = document.getElementById('btn-ingresar');
  if (pin) pin.disabled = false;
  if (btn) btn.disabled = false;
}

function togglePin() {
  const sec = document.getElementById('pin-section');
  const show = sec.style.display !== 'block';
  sec.style.display = show ? 'block' : 'none';
  if (show) document.getElementById('pin').focus();
}

function toggleVis() {
  const inp = document.getElementById('pin');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function ingresar() {
  const pin = document.getElementById('pin').value.trim();
  if (!pin || !ROLES) return;
  const rol = ROLES.find(r => r.pin === pin);
  if (!rol) {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('pin').value = '';
    document.getElementById('pin').focus();
    return;
  }
  localStorage.setItem('portal_sesion', JSON.stringify({
    rol_id:   rol.id,
    nombre:   rol.nombre,
    modulos:  rol.modulos,
    kioskos:  rol.kioskos,
    ts:       Date.now()
  }));
  window.location.href = 'index.html';
}

const sesion = JSON.parse(localStorage.getItem('portal_sesion')||'null');
if (sesion && (Date.now() - sesion.ts) < 8 * 60 * 60 * 1000) {
  window.location.href = 'index.html';
}

// El PIN arranca deshabilitado hasta cargar roles (igual que antes).
if (document.getElementById('pin')) document.getElementById('pin').disabled = true;
if (document.getElementById('btn-ingresar')) document.getElementById('btn-ingresar').disabled = true;
cargarRoles();

// ── LOGIN CON GOOGLE ──────────────────────────────────────────────
async function handleGoogleCredential(response) {
  const errBox = document.getElementById('google-error-msg');
  errBox.style.display = 'none';
  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ modulo: 'usuario_login_google', credential: response.credential })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'No se pudo validar con Google.');
    const r = data.result;
    if (!r || !r.encontrado) {
      throw new Error('Tu correo no tiene acceso asignado en el portal — pedile a un administrador que te agregue en Accesos.');
    }
    localStorage.setItem('portal_sesion', JSON.stringify({
      rol_id:     r.rol_id,
      nombre:     r.nombre,
      modulos:    parseLista(r.modulos),
      kioskos:    parseLista(r.kioskos),
      email:      r.email,
      usuario_id: r.usuario_id,
      ts:         Date.now()
    }));
    window.location.href = 'index.html';
  } catch (e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  }
}

if (GOOGLE_CLIENT_ID && window.google && google.accounts && google.accounts.id) {
  document.getElementById('google-section').style.display = 'block';
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
  google.accounts.id.renderButton(document.getElementById('g_id_button'), {
    theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', width: 300
  });
} else {
  // Sin Google disponible: mostramos el aviso y abrimos el PIN como respaldo.
  document.getElementById('google-unavailable').style.display = 'block';
  document.getElementById('pin-section').style.display = 'block';
}
</script>
</body>
</html>
