  EXPORTS.anomalias = () => ({ nombre: 'anomalias_' + c.rango.desde + '_' + c.rango.hasta + '.csv', csv: AC.csv(vista, [{ titulo: 'Etiqueta', valor: 'etiqueta' }, { titulo: 'Tipo', valor: x => ANOM_TIPOS[x.tipo] }, { titulo: 'Producto', valor: 'producto' }, { titulo: 'Proveedor', valor: 'proveedor' }, { titulo: 'Fecha', valor: 'fecha' }, { titulo: 'Detalle', valor: 'detalle' }, { titulo: 'Monto CRC', valor: x => Math.round(x.monto || 0) }, { titulo: 'Factura', valor: x => x.linea ? x.linea.numFactura : (x.facturas || []).join(' / ') }]) });
  const rows = vista.slice(0, 300).map(x => '<tr' + (x.linea || x.unidadKey ? ' class="click" onclick="abrirProducto(\'' + ukId(x.linea ? x.linea.unidadKey : x.unidadKey) + '\')"' : '') + '><td><span class="tag ' + col(x.etiqueta) + '">' + esc(x.etiqueta) + '</span></td><td style="font-size:12px">' + esc(ANOM_TIPOS[x.tipo]) + '</td><td class="nm-cell b">' + esc(x.producto) + '</td><td class="nm-cell">' + esc(x.proveedor) + '</td><td class="mono">' + fmtFecha(x.fecha) + '</td><td style="font-size:12px">' + esc(x.detalle) + (x.linea ? '<div class="sub">Factura ' + esc(x.linea.numFactura) + ' · ' + fmtPrecio(x.linea.precioBase, x.linea.magnitud) + '</div>' : '') + '</td><td class="num mono">' + fmtCRC(x.monto) + '</td></tr>').join('');
  // compras sin venta asociada: requiere consumo teórico
  const ct = consumoPeriodo(c);
  let pocaVenta;
  if (!ct.ingredientes.length) pocaVenta = '<div class="aviso warn"><span class="ico">!</span><div><b>"Compras frecuentes con poca o ninguna venta asociada" no se puede evaluar todavía.</b> Para saber cuánto de un producto se vendió hace falta enlazar ventas de Square con recetas: hoy ' + ct.nPresEnlazadas + ' de ' + ct.nPres + ' presentaciones de Menú y Recetas tienen "Nombre de venta en Square". Ver Compras vs Ventas → Consumo teórico.</div></div>';
  else {
    const filas = ct.comparacion.filter(x => x.compradoBase > 0 && (x.consumoBase === 0 || x.compradoBase > x.consumoBase * 2)).sort((a, b) => b.gasto - a.gasto);
    pocaVenta = '<div class="card flush"><div class="card-head"><div><p class="card-title">Compras con poca venta asociada</p><p class="card-sub">Productos cuya compra del período supera 2× el consumo teórico según recetas × ventas. Solo cuenta los platos enlazados (' + fmtN(ct.coberturaVentas, 0) + ' % de las ventas); lo no enlazado no se atribuye.</p></div></div><div class="tw"><table class="t"><thead><tr><th>Producto</th><th class="num">Comprado</th><th class="num">Consumo teórico</th><th class="num">Gasto</th></tr></thead><tbody>'
      + (filas.map(x => '<tr><td><span class="tag amber">Revisar</span> ' + esc(x.nombre) + '</td><td class="num mono">' + fmtQty(x.compradoBase, x.magnitud) + '</td><td class="num mono">' + fmtQty(x.consumoBase, x.magnitud) + '</td><td class="num mono">' + fmtCRC(x.gasto) + '</td></tr>').join('') || '<tr><td colspan="4"><div class="empty">Ninguno con los datos enlazados.</div></td></tr>') + '</tbody></table></div></div>';
  }
  const dupInfo = D.dup.corregidas.length || D.dup.sospechosas.length ? '<div class="aviso info"><span class="ico">i</span><div>Además, <b>' + D.dup.corregidas.length + '</b> factura(s) tienen sus líneas cargadas 2+ veces dentro del mismo archivo' + (CFG.corregirDuplicados ? ' y ya se cuentan una sola vez' : ' (corrección apagada)') + ', y <b>' + D.dup.sospechosas.length + '</b> suman ≈ 2× su total pero no se corrigieron solas. Detalle en Normalización → Calidad de datos.</div></div>' : '';
  el.innerHTML = '<div class="aviso info"><span class="ico">i</span><div>Estas son <b>señales estadísticas</b>, no conclusiones: "Posible anomalía" = fuera del rango habitual, "Variación significativa" = cambio grande vs lo normal, "Revisar" = requiere mirar el documento. Las reglas se ajustan en ⚙ Configurar.</div></div>' + dupInfo
    + '<div class="card flush"><div class="card-head"><div><p class="card-title">Señales del período · ' + lista.length + '</p><div class="chips" style="margin-top:8px">' + chips + '</div></div>' + btnExport('anomalias') + '</div>'
    + '<div class="tw"><table class="t"><thead><tr><th>Etiqueta</th><th>Tipo</th><th>Producto</th><th>Proveedor</th><th>Fecha</th><th>Detalle</th><th class="num">Monto</th></tr></thead><tbody>' + (rows || '<tr><td colspan="7"><div class="empty">Sin señales con las reglas actuales.</div></td></tr>') + '</tbody></table></div>' + (vista.length > 300 ? '<div class="card-foot">Mostrando 300 de ' + vista.length + ' (el CSV trae todas).</div>' : '') + '</div>' + pocaVenta;
}

// ═══════════════════════ COMPRAS VS VENTAS ═══════════════════════
const VTA = { gran: 'mes' };
function kioskosFiltroNorm() { return F.kioskos ? new Set(Array.from(F.kioskos).map(AC.normTxt)) : null; }
function consumoPeriodo(c) {
  const kf = kioskosFiltroNorm();
  const vp = RAW.ventasProd.filter(v => v.fecha >= c.rango.desde && v.fecha <= c.rango.hasta && kioskoPermitido(v.kiosko) && (!kf || kf.has(AC.normTxt(v.kiosko))));
  const usd = new Set(CFG.kioskosUSD.map(AC.normTxt));
  const vpCRC = vp.map(v => usd.has(AC.normTxt(v.kiosko)) ? Object.assign({}, v, { monto: v.monto * CFG.tipoCambio }) : v);
  const ct = AC.consumoTeorico(vpCRC, RAW.platos, RAW.recetas);
  // solo compras de kioskos que tienen ventas por producto en el período (si no, se compara compra de un kiosko contra venta de otro)
  const kVenta = new Set(vp.map(v => AC.normTxt(v.kiosko)));
  const comprasP = D.universo.filter(l => enRango(l, c.rango) && kVenta.has(AC.normTxt(l.kiosko)));
  ct.kioskosVenta = Array.from(new Set(vp.map(v => v.kiosko)));
  const porNombre = AC.agruparPor(comprasP, l => AC.normTxt(l.producto));
  ct.comparacion = ct.ingredientes.map(i => {
    const ls = (porNombre[AC.normTxt(i.ref)] || porNombre[AC.normTxt(i.nombre)] || []).filter(l => l.magnitud === i.magnitud);
    const comprado = AC.sum(ls, l => l.qtyBase), w = AC.wap(ls);
    return { nombre: i.nombre, magnitud: i.magnitud, consumoBase: i.qtyBase, compradoBase: comprado, gasto: AC.sum(ls, l => l.netoCRC), wap: w, costoTeorico: w != null ? w * i.qtyBase : null, mixta: i.magnitudMixta, sinCompras: !ls.length };
  });
  return ct;
}
function renderVentas(c) {
  const el = document.getElementById('tab-ventas');
  const kf = kioskosFiltroNorm();
  const compras = D.universo.filter(l => enRango(l, c.rango) && (!kf || kf.has(AC.normTxt(l.kiosko))) && !CFG.categoriasNoCosto.includes(l.categoria));
  const ventas = D.ventas.filter(v => v.fecha >= c.rango.desde && v.fecha <= c.rango.hasta && (!kf || kf.has(AC.normTxt(v.kiosko))));
  const filas = AC.comprasVsVentas(compras, ventas, { gran: VTA.gran, desde: c.rango.desde, hasta: c.rango.hasta, hoy: HOY, impuestoVentasPct: CFG.impuestoVentasPct, coberturaMin: CFG.coberturaMin, kioskosConCompras: D.kioskosConCompras });
  const cubs = Array.from(new Set(filas.map(f => f.cubeta))).sort();
  const ok = filas.filter(f => f.estado === 'ok');
  const agg = cubs.map(cb => { const fs = ok.filter(f => f.cubeta === cb); return { cb, v: AC.sum(fs, f => f.ventasNetas), cp: AC.sum(fs, f => f.compras) }; });
  const est = { 'ok': '<span class="tag green">comparable</span>', 'ventas-incompletas': '<span class="tag amber">ventas incompletas</span>', 'sin-compras-kiosko': '<span class="tag gray">sin compras cargadas</span>' };
  EXPORTS.ventas = () => ({ nombre: 'compras_vs_ventas_' + c.rango.desde + '_' + c.rango.hasta + '.csv', csv: AC.csv(filas, [{ titulo: 'Período', valor: 'cubeta' }, { titulo: 'Kiosko', valor: 'kiosko' }, { titulo: 'Ventas (con impuestos)', valor: f => Math.round(f.ventas) }, { titulo: 'Ventas netas', valor: f => Math.round(f.ventasNetas) }, { titulo: 'Compras costo de venta', valor: f => Math.round(f.compras) }, { titulo: 'Compras/ventas %', valor: f => f.ratio == null ? '' : f.ratio.toFixed(2) }, { titulo: 'Días con venta', valor: 'diasVenta' }, { titulo: 'Días', valor: 'dias' }, { titulo: 'Estado', valor: 'estado' }]) });
  const rows = filas.slice().sort((a, b) => a.cubeta < b.cubeta ? 1 : a.cubeta > b.cubeta ? -1 : a.kiosko.localeCompare(b.kiosko)).map(f => '<tr><td class="mono">' + fmtCubeta(f.cubeta, VTA.gran) + '</td><td class="b">' + esc(f.kiosko) + '</td><td class="num mono">' + fmtCRC(f.ventas) + '</td><td class="num mono">' + fmtCRC(f.ventasNetas) + '</td><td class="num mono">' + fmtCRC(f.compras) + '</td><td class="num mono b">' + (f.ratio == null ? '<span class="dash">—</span>' : '<span class="' + (f.ratio <= CFG.metaPct ? 'down' : 'up') + '">' + fmtN(f.ratio, 1) + ' %</span>') + '</td><td class="num mono">' + f.diasVenta + '/' + f.dias + '</td><td>' + est[f.estado] + '</td></tr>').join('');
  const totV = AC.sum(ok, f => f.ventasNetas), totC = AC.sum(ok, f => f.compras);
  // crecimiento vs período de comparación
  const vc = ventasComparables(c, c.rango), vp = ventasComparables(c, c.comp);
  const crecC = AC.pctCambio(vc.compras, vp.compras), crecV = AC.pctCambio(vc.ventasNetas, vp.ventasNetas);
  // COGS por tomas
  const tomas = AC.cogsPorTomas(RAW.inventario, D.universo.filter(l => !CFG.categoriasNoCosto.includes(l.categoria)), D.ventas, { impuestoVentasPct: CFG.impuestoVentasPct }).filter(t => !kf || kf.has(AC.normTxt(t.kiosko)));
  const tomaRows = tomas.map(t => '<tr><td class="b">' + esc(t.kiosko) + '</td><td class="mono">' + fmtFecha(t.desde) + ' → ' + fmtFecha(t.hasta) + '<div class="sub">' + t.dias + ' días</div></td><td class="num mono">' + fmtCRC(t.invInicial) + '</td><td class="num mono">+ ' + fmtCRC(t.compras) + '</td><td class="num mono">− ' + fmtCRC(t.invFinal) + '</td><td class="num mono b">' + fmtCRC(t.cogs) + '</td><td class="num mono">' + fmtCRC(t.ventasNetas) + '<div class="sub">' + t.diasVenta + ' días con venta</div></td><td class="num mono b">' + (t.foodCostPct == null ? '—' : fmtN(t.foodCostPct, 1) + ' %') + '</td><td class="num">' + (t.cobertura == null ? '—' : '<span class="' + (t.cobertura >= 80 ? 'down' : 'up') + '">' + fmtN(t.cobertura, 0) + ' %</span>') + '<div class="sub">' + t.productosContados + ' productos contados</div></td></tr>').join('');
  // consumo teórico
  const ct = consumoPeriodo(c);
  let consumoHtml;
  if (!ct.ingredientes.length) {
    consumoHtml = '<div class="aviso warn"><span class="ico">!</span><div><b>Consumo teórico: no calculable con los datos actuales.</b><br>'
      + 'Recetas cargadas: ' + RAW.recetas.filter(r => r.Tipo === 'receta').length + ' · platos: ' + RAW.platos.length + ' · presentaciones con "Nombre de venta en Square": <b>' + ct.nPresEnlazadas + ' de ' + ct.nPres + '</b>.<br>'
      + 'Para calcularlo: en <a href="recetas.html">Menú y Recetas</a>, completar en cada presentación el nombre exacto con que se vende en Square (ej. "Beach Lager Draft 16 onz"). Con eso: ventas × receta = consumo teórico, que se compara contra compras e inventario. No se enlaza por parecido de nombres para no inventar consumos.'
      + (Object.keys(ct.noEnlazados).length ? '<br>Productos más vendidos en el período sin enlazar: ' + Object.entries(ct.noEnlazados).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => esc(x[0])).join(', ') + '.' : '') + '</div></div>';
  } else {
    const costoT = AC.sum(ct.comparacion.filter(x => x.costoTeorico != null), x => x.costoTeorico);
    const ventasEnlNetas = ct.ventasEnlazadas / (1 + CFG.impuestoVentasPct / 100);
    consumoHtml = '<div class="kpis">' + kpi('Ventas enlazadas a receta', fmtN(ct.coberturaVentas, 0) + ' %', ct.nPresEnlazadas + ' de ' + ct.nPres + ' presentaciones enlazadas') + kpi('Costo teórico de lo vendido', fmtCRCc(costoT), 'consumo teórico × PPP del período') + kpi('Food cost teórico', ventasEnlNetas > 0 ? fmtN(costoT / ventasEnlNetas * 100, 1) + ' %' : '—', 'solo sobre ventas enlazadas', 'Costo teórico ÷ ventas netas de los productos enlazados.') + '</div>'
      + '<div class="tw"><table class="t"><thead><tr><th>Ingrediente</th><th class="num">Consumo teórico</th><th class="num">Comprado</th><th class="num">Diferencia</th><th class="num">Costo teórico</th></tr></thead><tbody>'
      + ct.comparacion.sort((a, b) => (b.costoTeorico || 0) - (a.costoTeorico || 0)).map(x => '<tr><td class="b">' + esc(x.nombre) + (x.sinCompras ? ' <span class="tag gray">sin compras en la unidad</span>' : '') + (x.mixta ? ' <span class="tag amber">unidades mixtas en receta</span>' : '') + '</td><td class="num mono">' + fmtQty(x.consumoBase, x.magnitud) + '</td><td class="num mono">' + fmtQty(x.compradoBase, x.magnitud) + '</td><td class="num">' + varHtml(AC.pctCambio(x.compradoBase, x.consumoBase)) + '</td><td class="num mono">' + fmtCRC(x.costoTeorico) + '</td></tr>').join('') + '</tbody></table></div>'
      + '<div class="card-foot">Kioskos con ventas por producto en el período: ' + esc(ct.kioskosVenta.join(', ')) + ' (solo sus compras entran en la comparación). Diferencia = comprado vs consumo teórico. Una diferencia positiva no es merma por sí sola: puede ser inventario que quedó en bodega. Para merma real hace falta inventario inicial y final.</div>';
  }
  el.innerHTML = '<div class="aviso info"><span class="ico">i</span><div>Esta vista usa solo <b>fecha y kiosko</b>. Compras = costo neto de las categorías que cuentan como costo de venta (⚙). Ventas = Square Consolidado (Ventas Netas Reales) y, si falta un día, el cierre de caja; se les descuenta ' + CFG.impuestoVentasPct + ' % de impuestos. <b>Compras / Ventas no es food cost</b>: lo comprado en un mes no es lo consumido ese mes.</div></div>'
    + '<div class="kpis">' + kpi('Ventas netas comparables', fmtCRCc(totV), ok.length ? Array.from(new Set(ok.map(f => f.kiosko))).join(', ') : 'ningún kiosko con cobertura suficiente') + kpi('Compras (costo de venta)', fmtCRCc(totC), 'mismos kioskos y períodos') + kpi('Compras / ventas netas', totV > 0 ? fmtN(totC / totV * 100, 1) + ' %' : '—', 'meta ' + CFG.metaPct + ' %', 'Proxy, no food cost.') + kpi('Crecimiento compras vs ventas', crecC == null || crecV == null ? '—' : fmtPct(crecC, 0) + ' / ' + fmtPct(crecV, 0), crecC == null || crecV == null ? 'sin base comparable en el ' + c.compTxt : 'compras / ventas netas vs ' + c.compTxt) + '</div>'
    + '<div class="card"><div class="card-head" style="padding:0 0 .6rem"><div><p class="card-title">Ventas netas vs compras · períodos comparables</p></div><select onchange="VTA.gran=this.value;render()">' + ['semana', 'mes', 'trimestre'].map(x => '<option value="' + x + '"' + (VTA.gran === x ? ' selected' : '') + '>Por ' + x + '</option>').join('') + '</select></div>'
    + (agg.some(x => x.v || x.cp) ? leyenda([{ nombre: 'Ventas netas', color: 'var(--s2)' }, { nombre: 'Compras', color: 'var(--s3)' }]) + svgBarras({ labels: agg.map(x => fmtCubeta(x.cb, VTA.gran)), series: [{ nombre: 'Ventas netas', color: 'var(--s2)', valores: agg.map(x => x.v) }, { nombre: 'Compras', color: 'var(--s3)', valores: agg.map(x => x.cp) }], tts: agg.map(x => '<b>' + fmtCubeta(x.cb, VTA.gran) + '</b><br>Ventas netas: ' + fmtCRC(x.v) + '<br>Compras: ' + fmtCRC(x.cp) + '<br>Compras/ventas: ' + (x.v ? fmtN(x.cp / x.v * 100, 1) + ' %' : '—')) }) : '<div class="empty">No hay kiosko/período con ventas y compras comparables en el rango. Revisá la tabla de abajo para ver qué falta.</div>')
    + '</div>'
    + '<div class="card flush"><div class="card-head"><div><p class="card-title">Detalle por kiosko y período</p><p class="card-sub">"Ventas incompletas" = ventas en menos del ' + CFG.coberturaMin + ' % de los días; "sin compras cargadas" = el kiosko no tiene facturas en Desglose_IA (extractor no instalado). Esos casos no se comparan.</p></div>' + btnExport('ventas') + '</div><div class="tw" style="max-height:460px;overflow-y:auto"><table class="t"><thead><tr><th>Período</th><th>Kiosko</th><th class="num">Ventas c/imp.</th><th class="num">Ventas netas</th><th class="num">Compras</th><th class="num">Compras / ventas</th><th class="num">Días con venta</th><th>Estado</th></tr></thead><tbody>' + (rows || '<tr><td colspan="8"><div class="empty">Sin datos.</div></td></tr>') + '</tbody></table></div></div>'
    + '<div class="card flush"><div class="card-head"><div><p class="card-title">Food cost real (con tomas de inventario)</p><p class="card-sub">Todas las tomas registradas (no depende del período elegido). COGS = inventario inicial + compras entre tomas − inventario final. "Cobertura" = % de esas compras cuyo producto se contó en las tomas; si es baja, el COGS mezcla productos contados y no contados.</p></div></div>'
    + (tomas.length ? '<div class="tw"><table class="t"><thead><tr><th>Kiosko</th><th>Entre tomas</th><th class="num">Inv. inicial</th><th class="num">Compras</th><th class="num">Inv. final</th><th class="num">COGS</th><th class="num">Ventas netas</th><th class="num">Food cost</th><th class="num">Cobertura</th></tr></thead><tbody>' + tomaRows + '</tbody></table></div>' : '<div class="empty">No hay dos tomas de inventario del mismo kiosko (hoy: ' + new Set(RAW.inventario.map(r => r['Toma ID'])).size + ' toma(s) en HISTORIAL_inventario). Hacen falta tomas completas al inicio y fin de cada período.</div>') + '</div>'

  const tnc = U.filter(l => l.flags.includes('total-no-cuadra'));
  const dupRows = D.dup.corregidas.map(d => '<tr><td class="mono">' + fmtFecha(d.fecha) + '</td><td>' + esc(d.kiosko) + '</td><td class="nm-cell">' + esc(d.proveedor) + '</td><td class="mono" style="font-size:11px">' + esc(d.numFactura) + '</td><td class="num mono">' + d.veces + '×</td><td class="num mono">' + d.lineas + ' → ' + (d.lineas - d.lineasQuitadas) + '</td><td class="num mono">' + fmtCRC(d.totalFactura) + '</td><td class="num mono">' + fmtCRC(d.sumaLineas) + '</td></tr>').join('');
  const sosRows = D.dup.sospechosas.map(d => '<tr><td class="mono">' + fmtFecha(d.fecha) + '</td><td>' + esc(d.kiosko) + '</td><td class="nm-cell">' + esc(d.proveedor) + '</td><td class="mono" style="font-size:11px">' + esc(d.numFactura) + '</td><td class="num mono">' + d.lineas + '</td><td class="num mono">' + fmtCRC(d.totalFactura) + '</td><td class="num mono">' + fmtCRC(d.sumaLineas) + '</td></tr>').join('');
  const fuentes = Object.entries(FUENTES).map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + (v.ok ? '<span class="tag green">ok</span>' : '<span class="tag red">error</span>') + '</td><td class="num mono">' + v.n + '</td><td style="font-size:12px">' + esc(v.error || '') + '</td></tr>').join('');
  el.innerHTML = dl + '<div class="kpis">' + kpi('Gasto homologado', gTot ? fmtN(gHom / gTot * 100, 0) + ' %' : '—', 'del gasto histórico tiene Nombre Estándar confirmado') + kpi('Textos sin homologar', sinH.length, 'combinaciones proveedor + texto de factura') + kpi('Nombres estándar', D.estandares.length, pares.length + ' pares muy parecidos para revisar') + kpi('Productos en unidades mezcladas', multi.length, 'no se pueden comparar sin conversión') + '</div>'
    + '<div class="card flush"><div class="card-head"><div><p class="card-title">Textos de factura sin Nombre Estándar</p><p class="card-sub">Ordenados por gasto. Las sugerencias son solo parecido de texto: <b>nada se une solo</b>. Al confirmar se guarda en Maestro_Productos (misma acción que Maestro de Productos) y aplica a todo el histórico.' + (PUEDE_HOMOLOGAR ? '' : ' Tu usuario no tiene acceso a Maestro de Productos: solo lectura.') + '</p></div><a class="btn" href="maestro-productos.html">Abrir Maestro de Productos</a></div>'
    + '<div class="tw"><table class="t"><thead><tr><th>Texto en factura</th><th>Proveedor</th><th class="num">Líneas</th><th class="num">Gasto</th><th>Última</th><th>Nombre estándar</th></tr></thead><tbody>' + (sinRows || '<tr><td colspan="6"><div class="empty">Todo homologado ✓</div></td></tr>') + '</tbody></table></div>'
    + (sinH.length > NORM.ver ? '<div class="pager">' + NORM.ver + ' de ' + sinH.length + ' <button class="btn" onclick="NORM.ver+=40;render()">Ver 40 más</button></div>' : '') + '</div>'
    + '<div class="grid2"><div class="card flush"><div class="card-head"><div><p class="card-title">Nombres estándar muy parecidos</p><p class="card-sub">¿Son el mismo producto? Revisalos en el Maestro; no se fusionan desde acá.</p></div></div><div class="tw" style="max-height:380px;overflow-y:auto"><table class="t"><thead><tr><th>Nombre A</th><th>Nombre B</th><th class="num">Similitud</th></tr></thead><tbody>'
    + (pares.slice(0, 80).map(p => '<tr><td>' + esc(p.a) + '<div class="sub">' + fmtCRCc(gPorProd[p.a] || 0) + '</div></td><td>' + esc(p.b) + '<div class="sub">' + fmtCRCc(gPorProd[p.b] || 0) + '</div></td><td class="num mono">' + fmtN(p.s * 100, 0) + ' %</td></tr>').join('') || '<tr><td colspan="3"><div class="empty">Ninguno.</div></td></tr>') + '</tbody></table></div></div>'
    + '<div class="card flush"><div class="card-head"><div><p class="card-title">Productos comprados en unidades que no se pueden unir</p><p class="card-sub">Ej. kg y caja. Se analizan por separado hasta que la ficha del Maestro diga cuánto trae el empaque (Unidad receta + Conversión).</p></div></div><div class="tw" style="max-height:380px;overflow-y:auto"><table class="t"><thead><tr><th>Producto</th><th>Unidades</th></tr></thead><tbody>'
    + (multi.slice(0, 80).map(x => '<tr><td class="b nm-cell">' + esc(x.p) + (x.hint ? '<div class="sub" title="Detectado en el texto de la factura; NO se aplica solo.">pista en el nombre: ' + fmtN(x.hint.cantidad) + ' ' + esc(x.hint.unidad) + '</div>' : '') + '</td><td style="font-size:12px">' + x.mags.map(m => esc(MAG_NOMBRE(m.m)) + ' <span class="sub" style="display:inline">(' + esc(m.raws.join(', ')) + ' · ' + m.n + ' líneas)</span>').join('<br>') + '</td></tr>').join('') || '<tr><td colspan="2"><div class="empty">Ninguno.</div></td></tr>') + '</tbody></table></div></div></div>'
    + '<div class="grid2"><div class="card flush"><div class="card-head"><div><p class="card-title">Cómo se interpretó cada unidad</p><p class="card-sub">kg, g, lb → peso · L, ml, gal → volumen · unid, pza, botella → unidades. Empaques y textos no reconocidos quedan aparte.</p></div></div><div class="tw" style="max-height:380px;overflow-y:auto"><table class="t"><thead><tr><th>Texto</th><th>Interpretación</th><th class="num">Factor</th><th class="num">Líneas</th><th class="num">Gasto</th></tr></thead><tbody>'
    + unis.map(u => '<tr><td class="mono">' + esc(u.raw) + '</td><td>' + esc(MAG_NOMBRE(u.mag)) + (u.fuente === 'maestro' ? ' <span class="tag green">ficha Maestro</span>' : u.fuente === 'desconocida' ? ' <span class="tag amber">no reconocida</span>' : '') + '</td><td class="num mono">' + (u.fuente === 'maestro' ? 'por producto' : fmtN(u.factor / unidadDe(u.mag).f, 4) + ' ' + esc(unidadDe(u.mag).u)) + '</td><td class="num mono">' + u.n + '</td><td class="num mono">' + fmtCRCc(u.g) + '</td></tr>').join('') + '</tbody></table></div></div>'
    + '<div class="card flush"><div class="card-head"><div><p class="card-title">Conversiones tomadas de la ficha del Maestro</p><p class="card-sub">Revisá que sean correctas: una conversión mal cargada distorsiona precios y alertas.</p></div></div><div class="tw" style="max-height:380px;overflow-y:auto"><table class="t"><thead><tr><th>Producto</th><th>Proveedor</th><th>Unidad factura</th><th>Conversión</th><th class="num">Líneas</th></tr></thead><tbody>'
    + (convs.map(x => '<tr><td class="b">' + esc(x.l.producto) + '</td><td class="nm-cell">' + esc(x.l.proveedor) + '</td><td class="mono">' + esc(x.l.unidadRaw) + '</td><td class="mono">' + esc(x.l.convDetalle) + '</td><td class="num mono">' + x.n + '</td></tr>').join('') || '<tr><td colspan="5"><div class="empty">Ninguna ficha con conversión en uso.</div></td></tr>') + '</tbody></table></div></div></div>'
    + '<div class="card"><p class="card-title">Calidad de datos</p>'
    + '<div class="aviso ' + (D.dup.corregidas.length ? 'warn' : 'info') + '"><span class="ico">!</span><div><b>' + D.dup.corregidas.length + ' factura(s) con líneas cargadas 2+ veces</b> en el mismo archivo (la suma de líneas da exactamente 2× el Total factura). ' + (CFG.corregirDuplicados ? 'Se cuenta una sola copia.' : '<b>Corrección apagada</b> en ⚙.') + ' Conviene borrar las copias en Desglose_IA; mientras tanto este análisis las descuenta.</div></div>'
    + (dupRows ? '<div class="tw" style="max-height:300px;overflow-y:auto;margin-bottom:1rem"><table class="t"><thead><tr><th>Fecha</th><th>Kiosko</th><th>Proveedor</th><th>Factura</th><th class="num">Veces</th><th class="num">Líneas</th><th class="num">Total factura</th><th class="num">Suma líneas</th></tr></thead><tbody>' + dupRows + '</tbody></table></div>' : '')
    + (sosRows ? '<div class="aviso warn"><span class="ico">!</span><div><b>' + D.dup.sospechosas.length + ' factura(s) sospechosas no corregidas</b>: suman ≈ 2× su total pero las líneas no están repetidas de forma uniforme. Revisalas a mano.</div></div><div class="tw" style="max-height:260px;overflow-y:auto;margin-bottom:1rem"><table class="t"><thead><tr><th>Fecha</th><th>Kiosko</th><th>Proveedor</th><th>Factura</th><th class="num">Líneas</th><th class="num">Total factura</th><th class="num">Suma líneas</th></tr></thead><tbody>' + sosRows + '</tbody></table></div>' : '')
    + '<div class="aviso info"><span class="ico">i</span><div><b>' + tnc.length + ' línea(s)</b> donde cantidad × precio − descuento (± impuesto) no coincide con "Total línea" de la IA. Se usa cantidad × precio; la línea queda marcada "total no cuadra" en Detalle.</div></div>'
    + (fd.length ? '<div class="aviso warn"><span class="ico">!</span><div><b>' + fd.length + ' línea(s) con fecha dudosa</b> (posterior a hoy o a su fecha de carga — probable día/mes invertido): ' + Array.from(new Set(fd.map(l => fmtFecha(l.fecha) + ' ' + l.proveedor))).slice(0, 8).map(esc).join(' · ') + '. No se corrigen solas: corregilas en la hoja.</div></div>' : '')
    + '<p class="lbl" style="margin-top:1rem">Fuentes cargadas</p><div class="tw"><table class="t"><thead><tr><th>Fuente</th><th>Estado</th><th class="num">Filas</th><th>Detalle</th></tr></thead><tbody>' + fuentes + '</tbody></table></div>'
    + metodoHtml() + '</div>';
}
async function homologar(i, nombre) {
  const x = NORM._sinH[i]; if (!x) return;
  const valor = (nombre || (document.getElementById('hom-' + i) || {}).value || '').trim();
  if (!valor) { toast('Escribí o elegí un nombre estándar.', 'error'); return; }
  const fm = D.maestroPorClave[x.k]; if (!fm) return;
  if (!D.estandares.includes(valor) && !confirm('"' + valor + '" es un nombre estándar NUEVO (no existe todavía). ¿Crear y asignarlo?')) return;
  try {
    const resp = await fetch(APPS_SCRIPT_AP, { method: 'POST', body: new URLSearchParams({ data: JSON.stringify({ modulo: 'maestro_guardar', clave: fm['Clave'] || x.k, nombre_estandar: valor, estado: 'Confirmado' }) }) });
    const json = await resp.json(); if (!json.ok) throw new Error(json.error || 'Error al guardar');
    OVERRIDES[x.k] = valor; fm['Nombre Estándar'] = valor;
    recalcular(); construirFiltros(); render(); toast('Guardado en Maestro: "' + x.l0.productoRaw + '" → ' + valor);
  } catch (e) { toast('No se pudo guardar: ' + e.message, 'error'); }
}

// ── ARRANQUE ────────────────────────────────────────────────────────
document.getElementById('date-chip').textContent = new Date().toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
cargarTodo();
</script>
